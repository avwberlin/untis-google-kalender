name: Stundenplan-Sync

# Warum eine Schleife statt vieler Einzelstarts?
# GitHub drosselt geplante Workflows stark: von 52 angeforderten Starts pro Tag
# wurden tatsaechlich nur etwa 3 ausgefuehrt. Deshalb startet ein Lauf nicht mehr
# einen einzelnen Sync, sondern haelt sich stundenlang am Leben und synct intern
# alle zwei Minuten. Ein einziger tatsaechlich gestarteter Lauf deckt damit einen
# ganzen Schultag ab.

on:
  schedule:
    # Weiterhin oft angefordert – jeder Start, den GitHub tatsaechlich zulaesst,
    # startet die Schleife neu und deckt danach viele Stunden ab.
    - cron: "*/15 4-16 * * 1-5"
  workflow_dispatch:
    inputs:
      takt:
        description: "Sekunden zwischen zwei Syncs"
        required: false
        default: "120"
      max_laufzeit:
        description: "Maximale Laufzeit der Schleife in Sekunden"
        required: false
        default: "19800"
      feierabend_utc:
        description: "Ab dieser UTC-Stunde nicht mehr syncen (99 = ignorieren, fuer Tests)"
        required: false
        default: "17"

# Ein neuer Start loest die alte Schleife ab, statt sich dahinter aufzustauen.
# Ein Abbruch mitten im Sync ist unkritisch, weil jeder Lauf idempotent ist.
concurrency:
  group: stundenplan-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub erlaubt hoechstens 360 Minuten je Job

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Sync-Schleife
        env:
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_ID: ${{ secrets.GCAL_ID }}
          # Abstand zwischen zwei Syncs, in Sekunden
          TAKT: ${{ inputs.takt || '120' }}
          # Nach dieser UTC-Stunde wird nicht mehr gesynct (17 UTC = 19 Uhr Berlin
          # im Sommer, 18 Uhr im Winter). 99 schaltet die Pruefung ab.
          FEIERABEND_UTC: ${{ inputs.feierabend_utc || '17' }}
          # Spaetestens nach dieser Laufzeit beenden, damit der Job sauber endet
          MAX_LAUFZEIT: ${{ inputs.max_laufzeit || '19800' }}   # Standard: 5 h 30 min
        run: |
          set -u
          start=$(date +%s)
          durchlauf=0
          fehler_in_folge=0

          while true; do
            durchlauf=$((durchlauf + 1))
            echo "::group::Durchlauf $durchlauf ($(date -u +%H:%M:%S) UTC)"

            if python sync.py; then
              fehler_in_folge=0
            else
              fehler_in_folge=$((fehler_in_folge + 1))
              echo "Sync fehlgeschlagen ($fehler_in_folge in Folge)."
              if [ "$fehler_in_folge" -ge 3 ]; then
                echo "::error::Dreimal hintereinander fehlgeschlagen – Lauf wird als Fehler beendet."
                echo "::endgroup::"
                exit 1
              fi
            fi
            echo "::endgroup::"

            stunde=$(date -u +%H)
            stunde=${stunde#0}
            if [ "${stunde:-0}" -ge "$FEIERABEND_UTC" ]; then
              echo "Schultag vorbei ($stunde Uhr UTC) – Schleife beendet nach $durchlauf Durchläufen."
              break
            fi

            if [ $(( $(date +%s) - start )) -ge "$MAX_LAUFZEIT" ]; then
              echo "Maximale Laufzeit erreicht – Schleife beendet nach $durchlauf Durchläufen."
              break
            fi

            sleep "$TAKT"
          done
